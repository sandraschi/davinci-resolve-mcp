name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Thanks for suggesting a new feature! Please fill out the information below to help us understand your idea.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief summary of the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem/Use Case
      description: What problem would this feature solve? What's the current limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: I think it would be great if...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
      placeholder: I also considered...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important for my workflow
        - Critical/blocking my work
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which area of DaVinci Resolve would this feature affect?
      options:
        - Project Management
        - Media Pool
        - Timeline Editing
        - Color Grading
        - Audio Processing
        - Rendering/Export
        - User Interface
        - Performance
        - Integration/API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any additional context, mockups, or examples?
      placeholder: Screenshots, links to similar features, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This feature would benefit other users
          required: true
        - label: I've searched for similar feature requests
          required: true
