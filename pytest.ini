[pytest]
# Pytest configuration for DaVinci Resolve MCP tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Test paths
testpaths = tests

# Add source directory to Python path
pythonpath = .

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test coverage configuration
# --cov=src
# --cov-report=term-missing
# --cov-report=html:coverage_html
# --cov-fail-under=50

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (require DaVinci Resolve)
    slow: Slow running tests
    requires_resolve: Tests that require DaVinci Resolve to be installed and running
    windows: Windows-specific tests
    macos: macOS-specific tests
    linux: Linux-specific tests
